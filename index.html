<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApZq5qvq6yPy59kmD6E0h4-wuNsNQXGk",
            authDomain: "app19-20b57.firebaseapp.com",
            databaseURL: "https://app19-20b57-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "app19-20b57",
            storageBucket: "app19-20b57.firebasestorage.app",
            messagingSenderId: "517817208702",
            appId: "1:517817208702:web:188b5e57a9b1d7a9eaad2f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const shoppingRef = ref(db, 'shoppingList');

        const CALENDAR_SRC = 'q7hema3qhbf475ptr3a4fuq7n0@group.calendar.google.com';
        const CALENDAR_TZ = 'Europe/Madrid';

        const MODE_LABELS = {
            DAY: 'Dia',
            WEEK: 'Setmana',
            MONTH: 'Mensual'
        };

        const everydayProducts = [
            { id: 'llet', name: 'Llet', icon: '🥛', defaultQty: '2' },
            { id: 'ous', name: 'Ous', icon: '🥚', defaultQty: '1 dotzena' },
            { id: 'pa', name: 'Pa', icon: '🥖', defaultQty: '1' },
            { id: 'fruita', name: 'Fruita', icon: '🍎', defaultQty: '1' },
            { id: 'verdures', name: 'Verdures', icon: '🥦', defaultQty: '1' },
            { id: 'carn', name: 'Carn', icon: '🥩', defaultQty: '1' },
            { id: 'peix', name: 'Peix', icon: '🐟', defaultQty: '1' },
            { id: 'iogurts', name: 'Iogurts', icon: '🥣', defaultQty: '1 pack' },
            { id: 'formatge', name: 'Formatge', icon: '🧀', defaultQty: '1' },
            { id: 'oli', name: 'Oli', icon: '🫗', defaultQty: '1' },
            { id: 'cafe', name: 'Cafè', icon: '☕', defaultQty: '1' },
            { id: 'neteja', name: 'Neteja', icon: '🧼', defaultQty: '1' }
        ];

        window.shoppingItems = [];
        let pendingItem = null;
        let currentCalendarMode = 'WEEK';
        let calendarLoadedOnce = false;

        function normalizeItems(raw) {
            if (!raw) return [];
            const arr = Array.isArray(raw) ? raw : Object.values(raw);
            return arr
                .filter(Boolean)
                .map(item => ({
                    name: String(item.name || ''),
                    icon: String(item.icon || '🛍️'),
                    quantity: String(item.quantity || '1'),
                    done: Boolean(item.done)
                }));
        }

        function renderAllLists() {
            renderEverydayGrid();
            renderCartList();
            renderSupermarketList();
        }

        onValue(shoppingRef, (snapshot) => {
            window.shoppingItems = normalizeItems(snapshot.val());
            renderAllLists();
        }, (err) => {
            console.error('Error llegint Firebase:', err);
            renderAllLists();
        });

        function saveShoppingItems() {
            renderAllLists();
            set(shoppingRef, window.shoppingItems).catch((err) => {
                console.error('Error guardant a Firebase:', err);
            });
        }

        window.switchView = function(viewName) {
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.toggle('active', sec.id === `view-${viewName}`);
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === viewName);
            });

            if (viewName === 'calendar' && !calendarLoadedOnce) {
                loadCalendarFrame(currentCalendarMode);
            }
            if (viewName === 'supermarket') {
                renderSupermarketList();
            }
        };

        window.triggerExitAlert = function() {
            alert('Avís registrat: sortida de casa.');
        };

        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const el = document.getElementById('side-clock');
            if (el) el.textContent = `${hh}:${mm}`;
        }

        function buildCalendarUrl(mode) {
            const params = new URLSearchParams({
                src: CALENDAR_SRC,
                ctz: CALENDAR_TZ,
                mode: mode,
                hl: 'ca',
                showTitle: '0',
                showNav: '1',
                showDate: '1',
                showPrint: '0',
                showTabs: '0',
                showCalendars: '0',
                showTz: '0',
                _refresh: String(Date.now())
            });
            return `https://calendar.google.com/calendar/embed?${params.toString()}`;
        }

        function updateModeBadge(mode) {
            const label = document.getElementById('calendar-mode-label');
            if (label) {
                label.textContent = `Vista: ${MODE_LABELS[mode] || mode}`;
            }
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        function loadCalendarFrame(mode = currentCalendarMode) {
            currentCalendarMode = mode;
            updateModeBadge(mode);
            const wrap = document.getElementById('calendar-frame-wrap');
            if (!wrap) return;
            wrap.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.id = 'family-calendar-iframe';
            iframe.title = 'Calendari de la família';
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('scrolling', 'no');
            iframe.src = buildCalendarUrl(mode);
            wrap.appendChild(iframe);
            calendarLoadedOnce = true;
        }

        window.reloadCalendarFrame = function() {
            loadCalendarFrame(currentCalendarMode);
        };

        window.setCalendarMode = function(mode) {
            loadCalendarFrame(mode);
        };

        function renderEverydayGrid() {
            const grid = document.getElementById('everyday-grid');
            if (!grid) return;
            grid.innerHTML = '';

            everydayProducts.forEach(prod => {
                const existing = window.shoppingItems.find(
                    item => item.name.toLowerCase() === prod.name.toLowerCase() && !item.done
                );
                const box = document.createElement('button');
                box.type = 'button';
                box.className = `product-box${existing ? ' selected' : ''}`;
                box.onclick = () => openQuantityModal(prod.name, prod.icon, existing ? existing.quantity : prod.defaultQty);

                const badgeHtml = existing
                    ? `<span class="product-qty-badge">${escapeHtml(existing.quantity)}</span>`
                    : '';

                box.innerHTML = `
                    <span class="product-icon">${prod.icon}</span>
                    <span class="product-name">${prod.name}</span>
                    ${badgeHtml}
                `;
                grid.appendChild(box);
            });
        }

        function renderCartList() {
            const listEl = document.getElementById('cart-list');
            const summaryEl = document.getElementById('shopping-summary');
            if (!listEl || !summaryEl) return;

            const activeCount = window.shoppingItems.filter(i => !i.done).length;

            summaryEl.textContent = activeCount === 1
                ? '1 producte a demanar'
                : `${activeCount} productes a demanar`;

            if (window.shoppingItems.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Prem un requadre o afegeix un producte esporàdic.</div>';
                return;
            }

            listEl.innerHTML = '';
            window.shoppingItems.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `cart-row${item.done ? ' done' : ''}`;
                row.innerHTML = `
                    <div class="cart-item-info" onclick="toggleDone(${index})">
                        <span class="cart-item-title">${item.icon ? item.icon + ' ' : ''}${escapeHtml(item.name)}</span>
                        <span class="cart-item-qty">Quantitat: ${escapeHtml(item.quantity)}</span>
                    </div>
                    <div class="cart-actions">
                        <button type="button" class="btn-mini" onclick="editCartItem(${index})">Quantitat</button>
                        <button type="button" class="btn-mini remove" onclick="removeCartItem(${index})">Treure</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function renderSupermarketList() {
            const listEl = document.getElementById('super-list');
            const progressEl = document.getElementById('super-progress');
            if (!listEl || !progressEl) return;

            const total = window.shoppingItems.length;
            const checkedCount = window.shoppingItems.filter(i => i.done).length;
            progressEl.textContent = `${checkedCount} / ${total} agafats`;

            if (total === 0) {
                listEl.innerHTML = '<div class="empty-state">No hi ha cap producte a la llista de la compra.</div>';
                return;
            }

            const orderedIndices = [
                ...window.shoppingItems.map((item, idx) => ({ item, idx })).filter(x => !x.item.done),
                ...window.shoppingItems.map((item, idx) => ({ item, idx })).filter(x => x.item.done)
            ];

            listEl.innerHTML = '';
            orderedIndices.forEach(({ item, idx }) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.style.touchAction = 'manipulation';
                btn.className = `super-item${item.done ? ' checked' : ''}`;
                btn.addEventListener('click', () => {
                    window.toggleDone(idx);
                });
                btn.innerHTML = `
                    <div class="super-item-main">
                        <span class="super-check-box">${item.done ? '✓' : ''}</span>
                        <div class="super-item-texts">
                            <span class="super-item-name">${item.icon ? item.icon + ' ' : ''}${escapeHtml(item.name)}</span>
                            <span class="super-item-sub">${item.done ? 'Agafat — prem per desmarcar' : 'Pendent — prem en agafar-lo'}</span>
                        </div>
                    </div>
                    <span class="super-qty-pill">${escapeHtml(item.quantity)}</span>
                `;
                listEl.appendChild(btn);
            });
        }

        window.clearCheckedItems = function() {
            window.shoppingItems = window.shoppingItems.filter(item => !item.done);
            saveShoppingItems();
        };

        function openQuantityModal(name, icon, initialQty) {
            pendingItem = { name, icon };
            document.getElementById('modal-product-name').textContent = name;
            document.getElementById('modal-icon').textContent = icon || '🛍️';
            const input = document.getElementById('modal-qty-input');
            input.value = initialQty || '1';
            document.getElementById('qty-modal').classList.add('open');
            setTimeout(() => {
                input.focus();
                input.select();
            }, 40);
        }

        window.closeQuantityModal = function() {
            pendingItem = null;
            document.getElementById('qty-modal').classList.remove('open');
        };

        window.closeModalOnBackdrop = function(event) {
            if (event.target.id === 'qty-modal') {
                closeQuantityModal();
            }
        };

        window.stepQuantity = function(delta) {
            const input = document.getElementById('modal-qty-input');
            const parsed = parseFloat(input.value.replace(',', '.'));
            if (!isNaN(parsed)) {
                const next = Math.max(1, parsed + delta);
                input.value = String(next);
            } else {
                input.value = '1';
            }
        };

        window.acceptQuantity = function() {
            if (!pendingItem) return;
            const rawQty = document.getElementById('modal-qty-input').value.trim();
            const quantity = rawQty || '1';

            const existingIndex = window.shoppingItems.findIndex(
                i => i.name.toLowerCase() === pendingItem.name.toLowerCase()
            );

            if (existingIndex >= 0) {
                window.shoppingItems[existingIndex].quantity = quantity;
                window.shoppingItems[existingIndex].done = false;
                if (pendingItem.icon) {
                    window.shoppingItems[existingIndex].icon = pendingItem.icon;
                }
            } else {
                window.shoppingItems.unshift({
                    name: pendingItem.name,
                    icon: pendingItem.icon || '🛍️',
                    quantity,
                    done: false
                });
            }

            saveShoppingItems();
            closeQuantityModal();
        };

        window.handleModalKey = function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                acceptQuantity();
            } else if (event.key === 'Escape') {
                closeQuantityModal();
            }
        };

        window.handleSporadicSubmit = function(event) {
            event.preventDefault();
            const input = document.getElementById('sporadic-input');
            const name = input.value.trim();
            if (!name) return;
            input.value = '';
            openQuantityModal(name, '🛍️', '1');
        };

        window.toggleDone = function(index) {
            if (!window.shoppingItems[index]) return;
            window.shoppingItems[index].done = !window.shoppingItems[index].done;
            saveShoppingItems();
        };

        window.editCartItem = function(index) {
            const item = window.shoppingItems[index];
            if (!item) return;
            openQuantityModal(item.name, item.icon || '🛍️', item.quantity);
        };

        window.removeCartItem = function(index) {
            window.shoppingItems.splice(index, 1);
            saveShoppingItems();
        };

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        renderAllLists();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
